name: Cloudflare 배포 (clue-note + 보드게임)

# 수동 실행(Actions 탭 → Run workflow) 또는 게임/사이트 코드가 바뀌어 이 브랜치에 올라오면 실행된다.
on:
  workflow_dispatch:
  push:
    branches: [ccr-f4655585-6w3q4l]
    paths: ['avalon/**', 'cloudflare/**', '.github/workflows/cloudflare-deploy.yml']

permissions:
  contents: read

concurrency: cloudflare-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: clue-note
      PAGES_BRANCH: main # Pages 프로젝트의 운영(Production) 브랜치 이름
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 게임 규칙 테스트
        working-directory: avalon
        run: npm ci && npm test

      - name: 배포 준비 확인 (클루 사이트 파일, Cloudflare 비밀값)
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          if ! ls cloudflare/clue-site/*.html >/dev/null 2>&1; then
            echo "::warning::cloudflare/clue-site 에 클루 노트 사이트 파일이 없어서 배포를 건너뜁니다. (그대로 올리면 지금 클루 노트가 사라짐)"
            ready=false
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN 과 CLOUDFLARE_ACCOUNT_ID 를 넣어야 배포됩니다."
            ready=false
          fi
          if [ "$ready" = false ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: 사이트 묶기 (클루 노트 + /board/ 보드게임)
        if: steps.check.outputs.ready == 'true'
        run: node cloudflare/build.mjs

      - name: 방 서버 배포 (Worker + Durable Object)
        if: steps.check.outputs.ready == 'true'
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: 사이트 배포 (Pages clue-note)
        if: steps.check.outputs.ready == 'true'
        working-directory: cloudflare/pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH" --commit-dirty=true
