<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a47">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="김정임류보드게임">
<meta name="description" content="김정임류보드게임 - 보드게임 노트 모음">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>김정임류보드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 메인 홈: 게임 목록. 카드는 build-site.js 가 games.json 으로 만든다. */
:root{
  --bg:#edf2f5; --surface:#ffffff; --ink:#10243a; --muted:#5b6d7e; --line:#cddae3;
  --navy:#0e2a47; --on-navy:#f2f7fb; --gold:#e8a500; --gold-soft:#fff3d1; --gold-ink:#6b4a00;
  --sel:#0e2a47; --on-sel:#f2f7fb; --blue:#1f6fa8; --surface2:#e2eaf0;
  --font:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --display:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1722; --surface:#122333; --ink:#e6eef5; --muted:#92a6b8; --line:#26425b;
  --navy:#08131f; --on-navy:#e9f1f8; --gold:#f2b92a; --gold-soft:#3a2c12; --gold-ink:#f5cf86;
  --sel:#5aaee8; --on-sel:#06121d; --blue:#5aaee8; --surface2:#1a3047; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1722; --surface:#122333; --ink:#e6eef5; --muted:#92a6b8; --line:#26425b;
  --navy:#08131f; --on-navy:#e9f1f8; --gold:#f2b92a; --gold-soft:#3a2c12; --gold-ink:#f5cf86;
  --sel:#5aaee8; --on-sel:#06121d; --blue:#5aaee8; --surface2:#1a3047; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.page{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.hero{background:var(--navy);color:var(--on-navy);padding:38px 20px 28px}
.hero h1{font:400 32px/1.15 var(--display);margin:0;letter-spacing:.01em}
.hero h1::after{content:'';display:block;width:44px;height:4px;background:var(--gold);border-radius:2px;margin-top:14px}
.hero p{margin:12px 0 0;font-size:14px;opacity:.82}
.banner{margin-top:22px;padding:12px 14px;font-size:13px;line-height:1.4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.banner>span:first-child{flex:1;min-width:0}
.banner .acts{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.btn.primary{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
main{padding:24px 16px 20px;flex:1}
h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 10px 2px}
.games{display:flex;flex-direction:column;gap:12px}
a.game{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;min-height:80px;-webkit-tap-highlight-color:transparent}
a.game:active{transform:scale(.985)}
.gicon{flex:none;width:54px;height:54px;border-radius:13px;background:var(--navy);display:grid;place-items:center}
.gicon svg{width:32px;height:32px}
.gtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gtext b{font-size:17px;line-height:1.3}
.gtext small{color:var(--muted);font-size:13px}
.resume{align-self:flex-start;margin-top:5px;font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:2px 10px}
.chev{flex:none;font-size:28px;line-height:1;color:var(--muted)}
.more{margin:18px 2px 0;font-size:13px;color:var(--muted)}
.foot{margin:0 16px;padding:16px 2px 32px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="page">
  <header class="hero">
    <h1>김정임류보드게임</h1>
    <p>우리끼리 보드게임 할 때 쓰는 노트 모음</p>
  </header>
  <main>
    <h2>게임 고르기</h2>
    <nav class="games" aria-label="게임 목록">
      <a class="game" href="/clue-onepiece/" data-game="clue-onepiece"><span class="gicon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="10" fill="none" stroke="#e8a500" stroke-width="3.6"/><path d="M28.5 28.5L38 38" stroke="#e8a500" stroke-width="4.4" stroke-linecap="round"/><path d="M16.5 21.5l3.6 3.6 6.4-7.2" fill="none" stroke="#f2f7fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="gtext"><b>클루:원피스</b><small>추리 노트 · 2~6명</small><span class="resume" hidden></span></span><span class="chev" aria-hidden="true">›</span></a>
      <a class="game" href="/board/" data-game="board"><span class="gicon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="9" width="30" height="30" rx="7" fill="none" stroke="#e8a500" stroke-width="3.4"/><circle cx="18" cy="18" r="2.8" fill="#f2f7fb"/><circle cx="30" cy="18" r="2.8" fill="#f2f7fb"/><circle cx="24" cy="24" r="2.8" fill="#f2f7fb"/><circle cx="18" cy="30" r="2.8" fill="#f2f7fb"/><circle cx="30" cy="30" r="2.8" fill="#f2f7fb"/></svg></span><span class="gtext"><b>보드게임</b><small>아발론·마피아·뱅! 등 · 방 만들어 같이 하기</small><span class="resume" hidden></span></span><span class="chev" aria-hidden="true">›</span></a>
    </nav>
    <p class="more">다른 게임 노트는 준비되는 대로 여기에 추가돼요.</p>
    <div class="banner" id="installbar" hidden></div>
  </main>
  <footer class="foot">추리 노트는 각자 폰에만 저장돼요. 같이 하는 사람의 카드나 추리는 서로 보이지 않아요. 보드게임 방은 같은 방에 들어온 사람끼리 실시간으로 연결돼요.</footer>
</div>

<script>
'use strict';
const GAMES=[{"id":"clue-onepiece","storageKey":"clue-op-note-v2"},{"id":"board","storageKey":null}];
const $=s=>document.querySelector(s);

/* 진행 중인 게임이 있으면 카드에 표시 (각 게임이 저장해 둔 값을 읽기만 한다) */
for(const g of GAMES){
  const el=document.querySelector('[data-game="'+g.id+'"] .resume');
  if(!el||!g.storageKey)continue;
  try{
    const j=JSON.parse(localStorage.getItem(g.storageKey));
    if(j&&j.started){
      const n=Array.isArray(j.players)?j.players.length:0,e=Array.isArray(j.events)?j.events.length:0;
      el.textContent='진행 중 · '+n+'명 · 기록 '+e+'개';el.hidden=false;
    }
  }catch(err){}
}

/* 앱 설치 안내 */
let deferredInstall=null,installDismissed=false,installHintLate=false;
try{installDismissed=localStorage.getItem('clue-install-dismissed')==='1';}catch(e){}
const hasManifest=()=>!!document.querySelector('link[rel="manifest"]');
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/android/i.test(navigator.userAgent);
function renderInstall(){
  const el=$('#installbar');if(!el)return;
  let msg='',btn='';
  if(hasManifest()&&!isStandalone()&&!installDismissed){
    if(deferredInstall){msg='앱으로 설치하면 홈 화면에서 바로 열려요.';btn='<button class="btn primary" data-act="install">설치</button>';}
    else if(isIOS())msg='아이폰은 아래쪽 공유 버튼을 누르고 “홈 화면에 추가”를 고르면 앱처럼 설치돼요.';
    else if(isAndroid()&&installHintLate)msg='브라우저 메뉴(⋮)에서 “앱 설치” 또는 “홈 화면에 추가”를 고르면 앱처럼 설치돼요.';
  }
  if(!msg){el.hidden=true;el.innerHTML='';return;}
  el.innerHTML='<span>'+msg+'</span><span class="acts">'+btn+'<button class="btn" data-act="install-close">닫기</button></span>';
  el.hidden=false;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;renderInstall();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;renderInstall();});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='install'){
    const d=deferredInstall;if(!d)return;
    deferredInstall=null;d.prompt();
    Promise.resolve(d.userChoice).then(()=>renderInstall(),()=>renderInstall());
    renderInstall();
  }else if(t.dataset.act==='install-close'){
    installDismissed=true;try{localStorage.setItem('clue-install-dismissed','1');}catch(e){}
    renderInstall();
  }
});
setTimeout(()=>{installHintLate=true;renderInstall();},4000);
renderInstall();
</script>

<script>if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
</html>
