# Cloudflare Pages 프로젝트 clue-note (클루 노트 + 보드게임). dist 폴더는 cloudflare/build.mjs 가 만든다.
name = "clue-note"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

# 보드게임 방 서버(board-rooms Worker의 Durable Object)를 /board/ws 에서 쓴다
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameHub"
script_name = "board-rooms"
